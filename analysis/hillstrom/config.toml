# The Hillstrom real-data demo: user-level rows from the 2008
# MineThatData e-mail challenge. The data file is NOT in this repository
# (its publisher never stated a license); fetch it first, then analyze:
#   python scripts/run_fetch_hillstrom.py
#   python scripts/run_analyze_experiment.py --config analysis/hillstrom/config.toml

[experiment]
name = "Hillstrom e-mail experiment"
alpha = 0.05
preamble = """
The data is Kevin Hillstrom's MineThatData E-Mail Analytics And Data
Mining Challenge (2008): 64,000 customers of a retailer randomly
assigned in thirds to a men's merchandise e-mail, a women's merchandise
e-mail, or no e-mail, with site visits, conversion, and dollars spent
tracked for the following two weeks. It is real user-level data and a
widely used public benchmark for incremental-lift analysis. The publisher
never stated a license, so the file is fetched from its original URL by
scripts/run_fetch_hillstrom.py (SHA-256 pinned there) rather than
redistributed in this repository. The data carries no per-day fields,
so the time-based sections do not appear below; that omission is the
report adapting to the data. It does carry a genuine data wart, the
misspelled category value the validation section records normalizing,
which is the kind of cleaning a real intake has to own out loud."""

[input]
shape = "user_rows"
path = "../../data/hillstrom/hillstrom.csv"
md5 = "0af45f3c7ee495ed5654b398b1aab809"

[columns]
arm = "segment"

[columns.aliases.zip_code]
"Surburban" = "Suburban"

# the FIRST label is the control arm
[arms]
labels = ["No E-Mail", "Mens E-Mail", "Womens E-Mail"]
intended_split = [0.3334, 0.3333, 0.3333]

[[metrics]]
name = "visit"
column = "visit"
kind = "binary"
primary = true

[[metrics]]
name = "conversion"
column = "conversion"
kind = "binary"

[[metrics]]
name = "spend"
column = "spend"
kind = "continuous"
nonnegative = true
