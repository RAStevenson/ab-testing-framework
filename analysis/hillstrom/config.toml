# The Hillstrom real-data example: user-level rows from the 2008
# MineThatData E-Mail Analytics And Data Mining Challenge, 64,000 customers
# of a retailer randomly assigned in thirds to a men's merchandise e-mail,
# a women's merchandise e-mail, or no e-mail, with site visits, conversion,
# and dollars spent tracked for the following two weeks. The publisher never
# stated a license, so the file is NOT in this repository; it is fetched
# from its original URL by scripts/run_fetch_hillstrom.py (SHA-256 pinned
# there). The data carries no per-day fields, so the monitoring replay does
# not appear. The history column (dollars spent in the year before the
# e-mail) is the pre-experiment column for CUPED on spend. Reproduce with:
#   python scripts/run_fetch_hillstrom.py
#   python scripts/run_analyze_experiment.py --config analysis/hillstrom/config.toml

[experiment]
name = "Hillstrom e-mail experiment"
alpha = 0.05

[input]
path = "../../data/hillstrom/hillstrom.csv"
md5 = "0af45f3c7ee495ed5654b398b1aab809"

[columns]
arm = "segment"

[columns.aliases.zip_code]
"Surburban" = "Suburban"

# the FIRST label is the control arm
[arms]
labels = ["No E-Mail", "Mens E-Mail", "Womens E-Mail"]
intended_split = [0.3334, 0.3333, 0.3333]

[[metrics]]
name = "visit"
column = "visit"
kind = "binary"
primary = true

[[metrics]]
name = "conversion"
column = "conversion"
kind = "binary"

[[metrics]]
name = "spend"
column = "spend"
kind = "continuous"
nonnegative = true
pre_column = "history"
