# The ASOS real-data example: one experiment from the ASOS Digital
# Experiments Dataset, real online controlled experiments from ASOS.com
# published as daily or twice-daily CUMULATIVE summary statistics per arm
# with no user-level rows (Liu, Cardoso, Couturier, McCoy, NeurIPS 2021,
# DOI 10.17605/OSF.IO/64JSB, CC BY 4.0). Provenance and integrity notes are
# in data/asos/LICENSE-DATA.md. Metrics are anonymized by the publisher;
# the dataset's OSF wiki describes metric 1 as binary, metrics 2 and 3 as
# count-based, and metric 4 as non-negative real. Experiment 54a85a was
# chosen by a rule that does not look at this tool's results: the datasheet
# flags one experiment for a possible primacy effect, and the rule takes it
# if its variances are complete at every checkpoint. Reproduce with:
#   python scripts/run_analyze_experiment.py --config analysis/asos/config.toml

[experiment]
name = "ASOS experiment 54a85a"
alpha = 0.05

[input]
shape = "aggregates"
path = "../../data/asos/asos_digital_experiments_dataset.csv"
md5 = "acdb1bebeede91cad1545f52d9a8a246"

[aggregates]
experiment_id_column = "experiment_id"
experiment_id = "54a85a"
variant = "variant_id"
metric = "metric_id"
checkpoint = "time_since_start"
count_control = "count_c"
mean_control = "mean_c"
variance_control = "variance_c"
count_treatment = "count_t"
mean_treatment = "mean_t"
variance_treatment = "variance_t"

[[metrics]]
name = "metric_1"
column = "1"
kind = "binary"
primary = true

[[metrics]]
name = "metric_2"
column = "2"
kind = "continuous"

[[metrics]]
name = "metric_3"
column = "3"
kind = "continuous"

[[metrics]]
name = "metric_4"
column = "4"
kind = "continuous"
