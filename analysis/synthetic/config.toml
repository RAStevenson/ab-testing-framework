# The synthetic pipeline check, not an example of analysis. One generated
# experiment runs through the real intake and readout, to show the pipeline
# works from start to finish. This one run is not evidence that the statistics
# are right; the test suite is that evidence.
# This file is both the generation recipe ([truth]) and the intake config the
# readout reads;
# scripts/run_synthetic_check.py writes the rows to data/synthetic/ (never
# committed) and then runs the same path as run_analyze_experiment.py.
# Reproduce with:
#   python scripts/run_synthetic_check.py

[experiment]
name = "Synthetic pipeline check (generated data, not a real experiment)"
alpha = 0.05

[input]
path = "../../data/synthetic/synthetic_experiment.csv"

[columns]
arm = "group"
day = "day"
user_id = "user_id"

# the FIRST label is the control arm
[arms]
labels = ["control", "treatment"]
intended_split = [0.5, 0.5]

[[metrics]]
name = "converted"
column = "converted"
kind = "binary"
primary = true

[[metrics]]
name = "spend"
column = "spend"
kind = "continuous"
nonnegative = true
pre_column = "pre_spend"

# the planted values, and the settings for the pre_spend column CUPED reads
[truth]
seed = 38
n_users = 120000
n_days = 14
base_rate = 0.06
absolute_lift = 0.004
novelty_boost = 0.008
novelty_half_life_days = 3.0
spend_rate = 0.06
spend_rate_lift = 0.004
log_mean = 3.4
log_sigma = 1.3
whale_rate = 0.008
whale_shape = 1.5
whale_scale = 400.0
pre_correlation = 0.9
