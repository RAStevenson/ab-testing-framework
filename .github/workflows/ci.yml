name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest

  report-drift:
    # analysis/checkout/report.md and analysis/asos/report.md are committed so
    # they read without running anything. This job is what keeps that promise
    # honest: regenerate both and fail if the working tree moved. Figures are
    # excluded because matplotlib renders them differently across versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_build_checkout_report.py
      - run: python scripts/run_analyze_experiment.py --config analysis/asos/config.toml --sweep
      # hillstrom is excluded here on purpose: its data is fetched, never
      # committed, and CI must not depend on a 2008 URL staying up. Its
      # logic is covered by the fixture-driven suite above.
      - name: Fail if a committed report is stale
        run: git diff --exit-code -- analysis/checkout/report.md analysis/asos/report.md
