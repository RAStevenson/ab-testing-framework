[build-system]
# 77 is the floor for PEP 639 license expressions (`license = "MIT"` plus
# `license-files`), which the [project] table below uses.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "A command-line readout for an exported experiment file: data checks and repairs, the standard tests through statsmodels and scipy, CUPED, and daily-monitoring boundaries at the sizes reached"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Robert Stevenson" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1.414",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abkit = ["py.typed"]

[tool.pyright]
# Type checking at the level a reader's editor runs by default (Pylance in
# VS Code reads this section too). A finding is fixed with explicit code; an
# ignore comment is used only where a library's own typing is wrong, and
# says so.
include = ["src", "scripts", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RET",           # return
    "ANN",           # type annotations
    "C4",            # comprehensions
    "RUF",           # ruff's own rules
]
ignore = [
    "ANN401",  # Any in **kwargs is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]     # test functions don't need return annotations
