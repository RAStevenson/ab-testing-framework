[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "A/B testing and experiment-analysis toolkit: data generators, frequentist and resampling tests, sequential monitoring, power analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RET",           # return
    "ANN",           # type annotations
]
ignore = [
    "ANN401",  # Any in **kwargs is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]     # test functions don't need return annotations
"analysis/*" = ["ANN"]
