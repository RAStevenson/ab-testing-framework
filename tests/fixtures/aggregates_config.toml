# Fixture config for the aggregate loader. The data file it names is
# fabricated in the ASOS side-by-side shape; nothing is real data.

[experiment]
name = "fixture-aggregates"
alpha = 0.05

[input]
shape = "aggregates"
path = "aggregates_ok.csv"

[aggregates]
experiment_id_column = "experiment_id"
experiment_id = "expA"
variant = "variant_id"
metric = "metric_id"
checkpoint = "time_since_start"
count_control = "count_c"
mean_control = "mean_c"
variance_control = "variance_c"
count_treatment = "count_t"
mean_treatment = "mean_t"
variance_treatment = "variance_t"

[[metrics]]
name = "metric_1"
column = "1"
kind = "binary"
primary = true

[[metrics]]
name = "metric_4"
column = "4"
kind = "continuous"
